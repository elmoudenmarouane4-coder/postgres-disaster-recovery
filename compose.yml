services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drill
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "drill", "-d", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres:
