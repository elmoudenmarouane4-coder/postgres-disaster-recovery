name: PostgreSQL recovery drill
on: [push, pull_request]
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: drill
          POSTGRES_PASSWORD: local-demo-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drill -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: drill
      PGPASSWORD: local-demo-only
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: bash -n scripts/backup.sh && bash -n scripts/restore.sh && bash -n scripts/drill.sh
      - run: ./scripts/drill.sh
